name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same ref, so a
# rapid push sequence doesn't pile up redundant full builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 24.04, not 22.04: the libspa-sys 0.10 bindings need PipeWire 1.0+ headers
    # (22.04's libspa is too old — missing spa_meta_region_is_valid etc.).
    runs-on: ubuntu-24.04
    # mold cuts the link step (the desktop binary pulls in webkit/gtk); only the
    # linker is affected, so it's a safe, build-wide speedup.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4

      # Plain apt install, same list as release.yml — the cache-apt-pkgs action
      # silently installed zero packages on a cold cache (v0.14.1), and its
      # pinned list here never gained libasound2-dev, breaking every CI run
      # since the MIDI pedal feature (v0.14.0).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libssl-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev clang pkg-config \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Faster linking (mold)
        uses: rui314/setup-mold@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: extractions/setup-just@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: cd apps/desktop && pnpm install --frozen-lockfile

      # cargo test/clippy compile the desktop crate, whose
      # tauri::generate_context! asserts frontendDist (apps/desktop/dist) exists.
      - name: Build frontend
        run: cd apps/desktop && pnpm build

      - name: Test + lint
        run: just check
